seed: 20260210

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  outputs_dir: outputs/ablation_hgt

data_files:
  microbe_disease: microbe-disease.txt
  drug_disease: drug-disease.txt
  drug_microbe: drug-microbe.txt

cv:
  n_folds: 5
  test_ratio: 0.2

embeddings:
  dim: 128
  walk_length: 80
  num_walks: 10
  window: 5
  epochs: 5
  workers: 1
  negative: 10
  min_count: 1

external_features:
  enabled: true
  cache_dir: data/external
  taxonomy_top_k:
    phylum: 20
    class: 25
    order: 25
    family: 30
    genus: 40
    species: 150
  mesh_level1_top_k: 60
  mesh_level2_top_k: 120
  mesh_level3_top_k: 220
  morgan_nbits: 2048
  morgan_radius: 2

v2:
  loss_fusion: uw   #uw：不确定性加权，让模型自动学习三个任务的 loss 权重，mean：三个任务 loss 直接平均--这个消融实验暂时没删
  uw_lr: 0.0005       #UncertaintyWeighting 自身参数的学习率
  aux_loss_weight: 0.6    #辅助 loss 的权重：total_loss = fusion_loss + 0.6 * struct_loss + 0.6 * bio_loss
  hidden_dim: 128
  emb_dim: 64
  num_heads: 4
  struct_layers: 2    #结构通道 HGT 层数
  gat_layers: 2       #GAT层数
  dropout: 0.2        #encoder 部分的 dropout
  epochs: 300
  lr: 0.0005
  weight_decay: 0.001
  patience: 60
  eval_every: 5
  warmup_epochs: 10
  label_smooth: 0.2      #标签平滑系数
  bio_kg_layers: 0      #生物通道第个阶段的解码器层数，0表示暂时不用，生物通道只用GAT

  similarity:
    knn_k: 20
    use_drug_gip: false
    gip_beta: 0      #GIP融合权重，当FS等为0时候，用GIP去补，可以为1可以为0，也可以为0.5等
